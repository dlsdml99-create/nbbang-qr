plugins { id 'com.android.application' }
def run = (System.getenv('RUN_NUMBER') ?: '1').toInteger()
android {
    namespace 'com.nbbang.qr'
    compileSdk 34
    defaultConfig {
        applicationId 'com.nbbang.qr'
        minSdk 24
        targetSdk 34
        versionCode run
        versionName "1.${run}"
        // 실제 폰(ARM)용만 넣어서 용량을 줄임
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    signingConfigs {
        fixed {
            // 서명 키와 비밀번호는 GitHub 비밀값(NBBANG_SIGNING)에서 빌드할 때만 꺼내 씀
            storeFile file(System.getenv('KEYSTORE') ?: 'missing.jks')
            storePassword System.getenv('KEY_PASS') ?: ''
            keyAlias 'nbbang'
            keyPassword System.getenv('KEY_PASS') ?: ''
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        // 배포용: 안 쓰는 코드·리소스를 지워 용량을 줄이고 더 빠르게
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.13.1'
    // 글자 인식 엔진은 폰의 Google Play 서비스에 있는 것을 빌려 씀 (앱 용량 약 40MB 절약)
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.2'
}
