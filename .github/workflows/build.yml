              <path android:fillColor="#FFE36E" android:pathData="M60,60h8v8h-8z M72,60h8v8h-8z M60,72h8v8h-8z M72,72h8v8h-8z"/>
          </vector>
          EOF_X
          cat > app/src/main/res/values/strings.xml <<'EOF_X'
          <resources><string name="app_name">N빵</string></resources>
          EOF_X
