# [N빵용] build.yml - dlsdml99-create/nbbang-qr 저장소 전용
name: N빵 APK 만들기
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nbbang-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 저장소 확인
        run: |
          if [ "${{ github.repository }}" != "dlsdml99-create/nbbang-qr" ]; then
            echo "::error::이 build.yml은 N빵(nbbang-qr) 저장소용이에요."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: QR 라이브러리 받기 (버전 고정)
        run: |
          curl -fsSL https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js -o app/src/main/assets/qrcode.js
          sed -i "s/__N__/${{ github.run_number }}/g" app/src/main/assets/index.html
      - name: APK 만들기
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SIGNING: ${{ secrets.NBBANG_SIGNING }}
        run: |
          if [ -z "$SIGNING" ]; then
            echo "::error::서명 키 비밀값(NBBANG_SIGNING)이 없어요. 저장소 Settings → Secrets and variables → Actions 에 넣어 주세요."
            exit 1
          fi
          export KEY_PASS="${SIGNING%%:*}"
          export KEYSTORE="$RUNNER_TEMP/nbbang.jks"
          echo "${SIGNING#*:}" | base64 -d > "$KEYSTORE"
          gradle assembleRelease --no-daemon --stacktrace
          rm -f "$KEYSTORE"
          cp app/build/outputs/apk/release/app-release.apk nbbang-qr.apk
          ls -la nbbang-qr.apk
      - name: 릴리스 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MB=$(awk "BEGIN{printf \"%.1f\", $(stat -c%s nbbang-qr.apk)/1048576}")
          echo "MB=$MB" >> "$GITHUB_ENV"
          sed -i "s/__N__/${{ github.run_number }}/g; s/__MB__/$MB/g" notes.md
          gh release delete "v${{ github.run_number }}" --yes --cleanup-tag || true
          gh release create "v${{ github.run_number }}" nbbang-qr.apk --latest --title "N빵 v1.${{ github.run_number }}" --notes-file notes.md
      - name: 다운로드 페이지
        run: |
          sed -i "s/__N__/${{ github.run_number }}/g; s/__MB__/$MB/g" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  pages:
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
