      - name: Create project
        run: |
          set -e
          mkdir -p app/src/main/java/com/nbbang/qr app/src/main/assets app/src/main/res/values app/src/main/res/drawable
          cat > settings.gradle <<'EOF_X'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "NbbangQR"
          include ':app'
          EOF_X
          cat > build.gradle <<'EOF_X'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF_X
          cat > gradle.properties <<'EOF_X'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF_X
          cat > app/build.gradle <<'EOF_X'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.nbbang.qr'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.nbbang.qr'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_X
          cat > app/src/main/AndroidManifest.xml <<'EOF_X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_X
          cat > app/src/main/res/values/strings.xml <<'EOF_X'
          <resources><string name="app_name">N빵 QR</string></resources>
          EOF_X
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_X'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
