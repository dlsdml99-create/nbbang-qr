          package com.nbbang.qr;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.os.Build;
          import android.graphics.Rect;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.core.content.FileProvider;

          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.Text;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.korean.KoreanTextRecognizerOptions;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          import java.io.File;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              private static final int REQ_CAMERA = 1, REQ_GALLERY = 2;
              private WebView web;
              private Uri photoUri;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          Uri u = req.getUrl();
                          if ("file".equals(u.getScheme())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) {}
                          return true;
                      }
                  });
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
                  checkUpdate();
              }

              // ── 새 버전 확인 (GitHub 최신 릴리스와 비교) ──
              private static final String RELEASE_API = "https://api.github.com/repos/dlsdml99-create/nbbang-qr/releases/latest";

              private void checkUpdate() {
                  new Thread(() -> {
                      try {
                          HttpURLConnection c = (HttpURLConnection) new URL(RELEASE_API).openConnection();
                          c.setRequestProperty("Accept", "application/vnd.github+json");
                          c.setConnectTimeout(8000);
                          c.setReadTimeout(8000);
                          if (c.getResponseCode() != 200) return;
                          StringBuilder sb = new StringBuilder();
                          try (BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"))) {
                              String line;
                              while ((line = r.readLine()) != null) sb.append(line);
                          }
                          JSONObject o = new JSONObject(sb.toString());
                          String digits = o.optString("tag_name", "").replaceAll("[^0-9]", "");
                          if (digits.isEmpty()) return;
                          long latest = Long.parseLong(digits);
                          String url = null;
                          JSONArray assets = o.optJSONArray("assets");
                          if (assets != null) {
                              for (int i = 0; i < assets.length(); i++) {
                                  JSONObject a = assets.getJSONObject(i);
                                  if (a.optString("name").endsWith(".apk")) { url = a.optString("browser_download_url"); break; }
                              }
                          }
                          if (url == null || latest <= currentVersion()) return;
                          final String u = url;
                          runOnUiThread(() -> showUpdate(latest, u));
                      } catch (Exception ignored) {}
                  }).start();
              }

              @SuppressWarnings("deprecation")
              private long currentVersion() {
                  try {
                      PackageInfo pi = getPackageManager().getPackageInfo(getPackageName(), 0);
                      return Build.VERSION.SDK_INT >= 28 ? pi.getLongVersionCode() : pi.versionCode;
                  } catch (Exception e) {
                      return Long.MAX_VALUE;
                  }
              }

              private void showUpdate(long latest, String url) {
                  if (isFinishing()) return;
                  new AlertDialog.Builder(this)
                      .setTitle("새 버전이 있어요")
                      .setMessage("v1." + latest + " 업데이트가 나왔어요.\n'업데이트'를 누르면 파일이 받아져요. 다 받으면 알림이나 다운로드에서 파일을 눌러 설치하세요.")
                      .setPositiveButton("업데이트", (d, w) -> {
                          try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception ignored) {}
                      })
                      .setNegativeButton("나중에", null)
                      .show();
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }

              class Bridge {
                  @JavascriptInterface
                  public void copy(String text) {
                      ClipboardManager cm = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("N빵", text));
                  }

                  @JavascriptInterface
                  public void scanReceipt() {
                      runOnUiThread(MainActivity.this::chooseSource);
                  }
              }

              private void chooseSource() {
                  new AlertDialog.Builder(this)
                      .setTitle("영수증 가져오기")
                      .setItems(new String[]{"카메라로 찍기", "앨범에서 고르기"}, (d, which) -> {
                          if (which == 0) openCamera(); else openGallery();
                      })
                      .setOnCancelListener(d -> status(""))
                      .show();
              }

              private void openCamera() {
                  try {
                      File dir = new File(getCacheDir(), "receipts");
                      dir.mkdirs();
                      File f = new File(dir, "receipt.jpg");
                      photoUri = FileProvider.getUriForFile(this, getPackageName() + ".files", f);
                      Intent i = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                      i.putExtra(MediaStore.EXTRA_OUTPUT, photoUri);
                      i.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivityForResult(i, REQ_CAMERA);
                  } catch (Exception e) {
                      fail("카메라를 열 수 없어요. 앨범에서 골라주세요.");
                  }
              }

              private void openGallery() {
                  try {
                      Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                      i.setType("image/*");
                      startActivityForResult(Intent.createChooser(i, "영수증 사진 고르기"), REQ_GALLERY);
                  } catch (Exception e) {
                      fail("앨범을 열 수 없어요.");
                  }
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != REQ_CAMERA && req != REQ_GALLERY) return;
                  if (res != RESULT_OK) { status(""); return; }
                  Uri u = req == REQ_CAMERA ? photoUri : (data != null ? data.getData() : null);
                  if (u == null) { fail("사진을 가져오지 못했어요."); return; }
                  recognize(u);
              }

              private void recognize(Uri u) {
                  status("영수증 읽는 중…");
                  try {
                      InputImage img = InputImage.fromFilePath(this, u);
                      TextRecognition.getClient(new KoreanTextRecognizerOptions.Builder().build())
                          .process(img)
                          .addOnSuccessListener(this::onText)
                          .addOnFailureListener(e -> fail("글자를 읽지 못했어요. 다시 찍어주세요."));
                  } catch (Exception e) {
                      fail("사진을 열 수 없어요.");
                  }
              }

              private void onText(Text text) {
                  List<ReceiptParser.Line> lines = new ArrayList<>();
                  for (Text.TextBlock b : text.getTextBlocks()) {
                      for (Text.Line l : b.getLines()) {
                          Rect r = l.getBoundingBox();
                          if (r == null) r = new Rect(0, 0, 0, 0);
                          lines.add(new ReceiptParser.Line(l.getText(), r.left, r.top, r.right, r.bottom));
                      }
                  }
                  ReceiptParser.Result r = ReceiptParser.parse(lines);
                  if (r.total <= 0) { fail("영수증에서 금액을 찾지 못했어요. 밝은 곳에서 가까이 찍어주세요."); return; }
                  try {
                      JSONObject o = new JSONObject();
                      o.put("ok", true);
                      o.put("total", r.total);
                      o.put("store", r.store);
                      js("window.onReceiptResult&&window.onReceiptResult(" + o + ")");
                  } catch (Exception e) {
                      fail("결과를 처리하지 못했어요.");
                  }
              }

              private void fail(String msg) {
                  try {
                      JSONObject o = new JSONObject();
                      o.put("ok", false);
                      o.put("error", msg);
                      js("window.onReceiptResult&&window.onReceiptResult(" + o + ")");
                  } catch (Exception ignored) {}
              }

              private void status(String msg) {
                  js("window.onReceiptStatus&&window.onReceiptStatus(" + JSONObject.quote(msg) + ")");
              }

              private void js(String code) {
                  web.post(() -> web.evaluateJavascript(code, null));
              }
          }
          EOF_X
          cat > app/src/main/java/com/nbbang/qr/ReceiptParser.java <<'EOF_X'
          package com.nbbang.qr;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /** 영수증 글자 줄들에서 최종 결제 금액과 가게 이름을 찾는다. */
          public class ReceiptParser {
              public static class Line {
                  public final String text; public final int left, top, right, bottom;
                  public Line(String text, int left, int top, int right, int bottom) {
                      this.text = text; this.left = left; this.top = top; this.right = right; this.bottom = bottom;
                  }
                  int cy() { return (top + bottom) / 2; }
                  int h() { return Math.max(1, bottom - top); }
              }

              public static class Result {
                  public final long total; public final String store;
                  Result(long total, String store) { this.total = total; this.store = store; }
              }

              // 앞에 있을수록 우선
              private static final String[] KEYS = {
                  "받을금액", "결제금액", "결제할금액", "청구금액", "총결제금액", "합계금액", "총합계", "총금액",
                  "판매합계", "판매금액", "승인금액", "카드승인", "합계", "총액", "total"
              };
              private static final String[] SKIP = { "부가세", "과세", "면세", "공급가", "할인", "봉사료", "거스름", "받은금액", "포인트", "적립" };
              private static final Pattern COMMA = Pattern.compile("(?<![\\d.,])(\\d{1,3}(?:[,.]\\d{3})+)(?![\\d,.]*\\d{2}[:/-])");
              private static final Pattern PLAIN_WON = Pattern.compile("(?<![\\d,])(\\d{3,8})\\s*원");

              static String norm(String s) { return s.replace(" ", "").toLowerCase(); }

              static List<Long> amounts(String text) {
                  List<Long> out = new ArrayList<>();
                  if (text.matches(".*\\d{2,4}[-/.]\\d{1,2}[-/.]\\d{1,2}.*") || text.matches(".*\\d{1,2}:\\d{2}.*")) return out; // 날짜·시간
                  if (text.matches(".*\\d{2,4}-\\d{3,4}-\\d{4}.*")) return out; // 전화·카드번호
                  Matcher m = COMMA.matcher(text);
                  while (m.find()) add(out, m.group(1).replaceAll("[,.]", ""));
                  Matcher p = PLAIN_WON.matcher(text);
                  while (p.find()) add(out, p.group(1));
                  return out;
              }

              private static void add(List<Long> out, String digits) {
                  try {
                      long v = Long.parseLong(digits);
                      if (v >= 100 && v <= 50_000_000) out.add(v);
                  } catch (NumberFormatException ignored) {}
              }

              private static boolean skip(String n) {
                  for (String s : SKIP) if (n.contains(s)) return true;
                  return false;
              }

              public static Result parse(List<Line> lines) {
                  long total = 0;
                  outer:
                  for (String key : KEYS) {
                      for (Line k : lines) {
                          String n = norm(k.text);
                          if (!n.contains(key) || skip(n)) continue;
                          // 1) 같은 줄
                          List<Long> same = amounts(k.text);
                          if (!same.isEmpty()) { total = same.get(same.size() - 1); break outer; }
                          // 2) 같은 높이의 오른쪽
                          Line best = null;
                          for (Line o : lines) {
                              if (o == k || o.left < k.left) continue;
                              if (Math.abs(o.cy() - k.cy()) <= k.h() && !amounts(o.text).isEmpty()) {
                                  if (best == null || o.left > best.left) best = o;
                              }
                          }
                          if (best != null) { List<Long> a = amounts(best.text); total = a.get(a.size() - 1); break outer; }
                          // 3) 바로 아래 줄
                          Line below = null;
                          for (Line o : lines) {
                              int dy = o.cy() - k.cy();
                              if (dy > 0 && dy <= k.h() * 2.5 && !amounts(o.text).isEmpty() && !skip(norm(o.text))) {
                                  if (below == null || dy < below.cy() - k.cy()) below = o;
                              }
                          }
                          if (below != null) { List<Long> a = amounts(below.text); total = a.get(a.size() - 1); break outer; }
                      }
                  }
                  if (total == 0) {
                      for (Line l : lines) {
                          if (skip(norm(l.text))) continue;
                          for (long v : amounts(l.text)) if (v > total) total = v;
                      }
                  }
                  return new Result(total, store(lines));
              }

              static String store(List<Line> lines) {
                  Line top = null;
                  for (Line l : lines) {
                      String t = l.text.trim();
                      if (t.length() < 2 || t.length() > 20) continue;
                      if (!t.matches(".*[가-힣].*") || t.matches(".*\\d.*")) continue;
                      if (t.contains("영수증") || t.contains("매출") || t.contains("고객") || t.contains("주문")) continue;
                      if (top == null || l.top < top.top) top = l;
                  }
                  return top == null ? "영수증" : top.text.trim();
              }
          }
