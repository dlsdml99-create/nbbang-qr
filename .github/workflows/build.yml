      - name: Create project
        run: |
          set -e
          mkdir -p app app/src/main app/src/main/java/com/nbbang/qr app/src/main/res/drawable app/src/main/res/values app/src/main/res/xml app/src/main/assets
          cat > app/build.gradle <<'EOF_X'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.nbbang.qr'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.nbbang.qr'
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName '1.1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.core:core:1.13.1'
              implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
          }
          EOF_X
          cat > app/src/main/AndroidManifest.xml <<'EOF_X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.files"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF_X
          cat > app/src/main/java/com/nbbang/qr/MainActivity.java <<'EOF_X'
          package com.nbbang.qr;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Intent;
          import android.graphics.Rect;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.core.content.FileProvider;

          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.Text;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.korean.KoreanTextRecognizerOptions;

          import org.json.JSONObject;

          import java.io.File;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              private static final int REQ_CAMERA = 1, REQ_GALLERY = 2;
              private WebView web;
              private Uri photoUri;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          Uri u = req.getUrl();
                          if ("file".equals(u.getScheme())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) {}
                          return true;
                      }
                  });
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }

              class Bridge {
                  @JavascriptInterface
                  public void copy(String text) {
                      ClipboardManager cm = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("N빵", text));
                  }

                  @JavascriptInterface
                  public void scanReceipt() {
                      runOnUiThread(MainActivity.this::chooseSource);
                  }
              }

              private void chooseSource() {
                  new AlertDialog.Builder(this)
                      .setTitle("영수증 가져오기")
                      .setItems(new String[]{"카메라로 찍기", "앨범에서 고르기"}, (d, which) -> {
                          if (which == 0) openCamera(); else openGallery();
                      })
                      .setOnCancelListener(d -> status(""))
                      .show();
              }

              private void openCamera() {
                  try {
                      File dir = new File(getCacheDir(), "receipts");
                      dir.mkdirs();
                      File f = new File(dir, "receipt.jpg");
                      photoUri = FileProvider.getUriForFile(this, getPackageName() + ".files", f);
                      Intent i = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                      i.putExtra(MediaStore.EXTRA_OUTPUT, photoUri);
                      i.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivityForResult(i, REQ_CAMERA);
                  } catch (Exception e) {
                      fail("카메라를 열 수 없어요. 앨범에서 골라주세요.");
                  }
              }

              private void openGallery() {
                  try {
                      Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                      i.setType("image/*");
                      startActivityForResult(Intent.createChooser(i, "영수증 사진 고르기"), REQ_GALLERY);
                  } catch (Exception e) {
                      fail("앨범을 열 수 없어요.");
                  }
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != REQ_CAMERA && req != REQ_GALLERY) return;
                  if (res != RESULT_OK) { status(""); return; }
                  Uri u = req == REQ_CAMERA ? photoUri : (data != null ? data.getData() : null);
                  if (u == null) { fail("사진을 가져오지 못했어요."); return; }
                  recognize(u);
              }

              private void recognize(Uri u) {
                  status("영수증 읽는 중…");
                  try {
                      InputImage img = InputImage.fromFilePath(this, u);
                      TextRecognition.getClient(new KoreanTextRecognizerOptions.Builder().build())
                          .process(img)
                          .addOnSuccessListener(this::onText)
                          .addOnFailureListener(e -> fail("글자를 읽지 못했어요. 다시 찍어주세요."));
                  } catch (Exception e) {
                      fail("사진을 열 수 없어요.");
                  }
              }

              private void onText(Text text) {
                  List<ReceiptParser.Line> lines = new ArrayList<>();
                  for (Text.TextBlock b : text.getTextBlocks()) {
                      for (Text.Line l : b.getLines()) {
                          Rect r = l.getBoundingBox();
                          if (r == null) r = new Rect(0, 0, 0, 0);
                          lines.add(new ReceiptParser.Line(l.getText(), r.left, r.top, r.right, r.bottom));
                      }
                  }
                  ReceiptParser.Result r = ReceiptParser.parse(lines);
                  if (r.total <= 0) { fail("영수증에서 금액을 찾지 못했어요. 밝은 곳에서 가까이 찍어주세요."); return; }
                  try {
                      JSONObject o = new JSONObject();
                      o.put("ok", true);
                      o.put("total", r.total);
                      o.put("store", r.store);
                      js("window.onReceiptResult&&window.onReceiptResult(" + o + ")");
                  } catch (Exception e) {
                      fail("결과를 처리하지 못했어요.");
                  }
              }

              private void fail(String msg) {
                  try {
                      JSONObject o = new JSONObject();
                      o.put("ok", false);
                      o.put("error", msg);
                      js("window.onReceiptResult&&window.onReceiptResult(" + o + ")");
                  } catch (Exception ignored) {}
              }

              private void status(String msg) {
                  js("window.onReceiptStatus&&window.onReceiptStatus(" + JSONObject.quote(msg) + ")");
              }

              private void js(String code) {
                  web.post(() -> web.evaluateJavascript(code, null));
              }
          }
